<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title><%= htmlWebpackPlugin.options.title %></title>
    <link rel="apple-touch-icon" sizes="180x180" href="dist/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="dist/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="dist/favicon-16x16.png" />
    <link rel="manifest" href="dist/site.webmanifest" />
    <link rel="mask-icon" href="dist/safari-pinned-tab.svg" color="#000000" />
    <meta name="apple-mobile-web-app-title" content="Bitburner" />
    <meta name="application-name" content="Bitburner" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-config" content="dist/browserconfig.xml" />
    <meta name="theme-color" content="#000000" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background-color: black;
      }
      * {
        -ms-overflow-style: none; /* for Internet Explorer, Edge */
        scrollbar-width: none; /* for Firefox */
      }
      .myGlyphMarginClass {
        background: red;
      }
      .myContentClass {
        background: lightblue;
      }
      *::-webkit-scrollbar {
        display: none; /* for Chrome, Safari, and Opera */
      }

      /* Keep the game inside the phone viewport and avoid page-level sideways scrolling. */
      @media (max-width: 600px) {
        html {
          font-size: 15px;
          overflow-x: hidden;
        }
        body {
          max-width: 100%;
          overflow-x: hidden;
          font-size: 13px;
        }
        #root {
          width: 100%;
          max-width: 100%;
          min-width: 0;
          overflow-x: hidden;
        }
        #root * {
          min-width: 0;
        }
        .MuiTypography-root {
          line-height: 1.35;
          overflow-wrap: anywhere;
        }
        .MuiButton-root {
          min-width: 0;
          min-height: 36px;
          padding: 4px 7px;
          font-size: 0.78rem;
        }
        .MuiTableContainer-root {
          max-width: 100%;
          overflow-x: auto;
        }
        .MuiTableCell-root {
          padding: 6px 8px;
          font-size: 0.8rem;
        }
        .MuiTabs-root {
          max-width: 100%;
        }
        .MuiTab-root {
          min-width: 0;
          padding: 6px 8px;
          font-size: 0.75rem;
        }
        .MuiFormControl-root {
          max-width: 100%;
        }
        .MuiDialog-paper {
          max-width: calc(100% - 16px);
          margin: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root" style="display:flex"></div>
  </body>
</html>
